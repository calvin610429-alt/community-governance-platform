<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社區治理助理 V0.1</title><style>body{margin:0;background:#f5f6f4;color:#202725;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:22px}.muted{color:#6b7471}.em{border:2px solid #a64b45;background:white;padding:16px;border-radius:16px;width:100%;text-align:left;font-size:18px}.card{background:white;border:1px solid #d9dfdc;border-radius:16px;padding:17px;margin:14px 0}.btn,.q{width:100%;padding:15px;border:0;border-radius:13px;background:#315f55;color:white;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q{background:white;color:#202725;border:1px solid #d9dfdc;text-align:left}.nav{position:sticky;bottom:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px}.nav button{border:0;background:none;font-size:15px}</style></head><body><main class="wrap" id="app"></main><nav class="nav"><button onclick="home()">今天</button><button onclick="things()">處理事情</button><button onclick="history()">找以前</button></nav><script>const A=document.getElementById('app');function home(){A.innerHTML=`<div class=muted>幸福社區</div><h1>今天</h1><div class=muted>2026年8月20日</div><button class=em onclick="emergency()"><b>緊急事件</b><br><small>有人受困、火災、大量進水或其他立即危險</small></button><h2>今天要處理</h2><div class=card><h3>702住戶天花板漏水</h3><p>現在：先確認漏水現況與可能來源</p><button class=btn onclick="leak()">繼續處理</button></div><h2>近期要注意</h2><div class=card><h3>水塔清洗</h3><p>距目前可查的上次紀錄約6個月</p><button class=btn onclick="water()">查看</button></div><h2>主動處理新的事情</h2><div class=grid>${['漏水／進水','設備／維修','保養／檢查','財務／費用','住戶／公共事務','會議／行政','文件／合約','其他／不確定'].map(x=>`<button class=q onclick="route('${x}')">${x}</button>`).join('')}</div>`}function things(){A.innerHTML='<h1>你現在要處理什麼？</h1><div class=grid>'+['漏水／進水','設備／維修','保養／檢查','財務／費用','住戶／公共事務','會議／行政','文件／合約','其他／不確定'].map(x=>`<button class=q onclick="route('${x}')">${x}</button>`).join('')+'</div>'}function route(x){if(x.includes('漏水'))leak();else if(x.includes('保養'))water();else if(x.includes('會議'))meeting();else A.innerHTML=`<h1>${x}</h1><div class=card>入口已保留。這一版先驗證分類與主動尋找功能是否自然。</div><button class=btn onclick="things()">返回選擇</button>`}function leak(){A.innerHTML=`<h1>702住戶天花板漏水</h1><div class=card><b>現在先做這個</b><p>先確認漏水現況與可能來源。</p></div><button class=btn onclick="A.innerHTML='<h1>現勘後怎麼樣？</h1><button class=q onclick=&quot;waiting()&quot;>需要進住戶家確認</button><button class=q>已找到原因</button><button class=q>等廠商後續回覆</button><button class=q>收到報價</button>'">我已確認現場</button>`}function waiting(){A.innerHTML=`<h1>接下來需要等</h1><div class=card>802住戶確認可以入內時間</div><div class=card>大明水電確認可配合時間</div><button class=btn onclick="home()">正確，回到今天</button>`}function water(){A.innerHTML=`<h1>水塔清洗</h1><div class=card><b>上次紀錄</b><p>2026/03/15<br>潔淨公司<br>NT$8,500</p></div><button class=btn>沿用上次廠商</button><button class=q>其他廠商</button><button class=q>還沒決定</button>`}function meeting(){A.innerHTML=`<h1>區分所有權人會議</h1><div class=card>先確認預定日期與社區規約位置。資料可以分次完成，不需要一次建立82戶。</div><button class=btn>開始準備</button>`}function emergency(){A.innerHTML=`<h1>緊急事件</h1><button class=q onclick="A.innerHTML='<h1>有人受困電梯</h1><div class=card><b>立即聯絡 XX電梯維保</b><p>若有人受傷、胸口不舒服或有其他立即危險，立即撥119。</p></div><button class=btn>撥119</button><button class=q>聯絡XX電梯維保</button>'">有人受困</button><button class=q>火災／煙霧</button><button class=q>大量進水</button>`}function history(){A.innerHTML=`<h1>找以前</h1><div class=card><b>2025/06｜B1漏水</b><p>大明水電｜NT$7,800｜已完成</p></div><div class=card><b>2026/03/15｜水塔清洗</b><p>潔淨公司｜NT$8,500</p></div>`}home()</script></body></html>
